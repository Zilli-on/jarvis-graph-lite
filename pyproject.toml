[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-graph-lite"
version = "0.12.4"
description = "Repo-local code intelligence layer for Python projects. Stdlib only, zero dependencies."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = []
authors = [
    {name = "Fabi Damboeck"},
]
keywords = ["code-intelligence", "static-analysis", "python", "call-graph", "refactoring", "code-health"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/Zilli-on/jarvis-graph-lite"
Repository = "https://github.com/Zilli-on/jarvis-graph-lite"
Changelog = "https://github.com/Zilli-on/jarvis-graph-lite/blob/main/CHANGELOG.md"
Issues = "https://github.com/Zilli-on/jarvis-graph-lite/issues"

[project.scripts]
jarvis-graph = "jarvis_graph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Silence the pytest-asyncio PytestDeprecationWarning on every run.
# This project is stdlib-only with synchronous tests, but the globally
# installed pytest-asyncio plugin still warns when this scope is unset.
# Pin it to the future default to keep runs clean (behavior-neutral here).
asyncio_default_fixture_loop_scope = "function"

[tool.ruff.lint]
# The rule set is spelled out because CI installs ruff unpinned: ruff 0.17
# lints far more than these classic defaults, which turned CI red without a
# line of code changing. Widening the set is a deliberate change, not an
# upgrade side effect.
select = ["E4", "E7", "E9", "F"]
# E402 (module-import-not-at-top-of-file) is ignored project-wide
# because several modules intentionally late-bind imports after
# sys.path / bootstrap code. Not a defect; a pattern. New code can
# still use E402 if justified.
ignore = ["E402"]
